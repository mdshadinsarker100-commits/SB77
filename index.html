<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SB77</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0a0a0a;
            color: #fff;
        }

        /* Header Top Social */
        .top-bar {
            background: #111;
            padding: 8px 15px;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }

        .top-bar img {
            width: 22px;
            height: 22px;
        }

        /* Main Header */
        .header {
            background: #001d39;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00a2ff;
        }

        .menu {
            display: flex;
            gap: 20px;
            font-size: 18px;
        }

        .menu a {
            text-decoration: none;
            color: #fff;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }

        .login {
            background: #ffaa00;
        }

        .register {
            background: #ff3d3d;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- Social Icons -->
    <div class="top-bar">
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png"></a> <!-- FB -->
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png"></a> <!-- Telegram -->
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/124/124034.png"></a> <!-- WhatsApp -->
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png"></a> <!-- Instagram -->
    </div>

    <!-- Main Header -->
    <div class="header">
        <div class="logo">SB77</div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Sports</a>
            <a href="#">Casino</a>
            <a href="#">Live</a>
            <a href="#">Slots</a>
            <a href="#">Contact</a>
        </div>

        <div class="buttons">
            <button class="btn login">Login</button>
            <button class="btn register">Register</button>
        </div>
    </div>

</body>
</html>
