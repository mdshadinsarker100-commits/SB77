<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SB77</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Header -->
  <header class="header">
    <img src="https://i.imgur.com/U5UZo1p.png" class="logo">
  </header>

  <!-- Banner -->
  <section class="banner">
    <img src="https://i.imgur.com/7B1Wf8Y.jpg" class="banner-img">
  </section>

  <!-- Games Section -->
  <section class="games-section">
    <h2 class="games-title">Popular Games</h2>

    <div class="game-grid">

      <div class="game-card">
        <img src="https://i.imgur.com/88Y2jqa.png">
        <p>Aviator</p>
      </div>

      <div class="game-card">
        <img src="https://i.imgur.com/DQwNiNo.png">
        <p>Crash</p>
      </div>

      <div class="game-card">
        <img src="https://i.imgur.com/MAu0hyl.png">
        <p>Slots</p>
      </div>

      <div class="game-card">
        <img src="https://i.imgur.com/EJ5F5Ls.png">
        <p>Sports</p>
      </div>

    </div>
  </section>

  <!-- Payment Section -->
  <section class="payment">
    <h2 class="payment-title">Payment Methods</h2>

    <div class="payment-flex">
      <img src="https://i.imgur.com/5qpWy8E.png">
      <img src="https://i.imgur.com/3szMuZD.png">
    </div>

    <p class="payment-number">📞 01336708149</p>
    <p class="warning">⚠️ শুধুমাত্র Send Money গ্রহণ করা হয়</p>
  </section>

  <!-- Footer -->
  <footer class="footer">
    © 2025 SB77 – Fast & Secure Gaming
  </footer>

</body>
</html>
