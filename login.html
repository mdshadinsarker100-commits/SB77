<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><div class="logo">SB77</div></header>
<section style="padding:14px">
  <h2 class="section-title">Login</h2>
  <div class="card" style="padding:12px">
    <input placeholder="Email or Username" style="width:100%;padding:10px;border-radius:8px;background:#0e1220;color:#fff;border:1px solid #253041">
    <input placeholder="Password" type="password" style="width:100%;padding:10px;border-radius:8px;background:#0e1220;color:#fff;border:1px solid #253041;margin-top:8px">
    <a class="btn-green action" href="#">Login</a>
    <p style="color:#97a3b0;margin-top:8px">No account? <a href="signup.html" style="color:var(--accent)">Register</a></p>
  </div>
</section>
<footer class="footer">Secure login • SB77</footer>
</body></html>
